openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AdOps Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sites
    description: Portal/site management
  - name: clients
    description: Client management
  - name: agencies
    description: Agency management
  - name: campaigns
    description: Campaign management
  - name: insertions
    description: Insertion management
  - name: evidences
    description: Evidence/print management
  - name: dashboard
    description: Dashboard & analytics
  - name: operations
    description: Operational diagnostics, topology and queued jobs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ops/runtime-topology:
    get:
      operationId: getOpsRuntimeTopology
      tags: [operations]
      summary: Get the sanitized runtime topology and permission boundaries
      responses:
        "200":
          description: Runtime topology without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsRuntimeTopology"

  /ops/jobs/drive-pi-reconcile:
    post:
      operationId: createDrivePiReconcileJob
      tags: [operations]
      summary: Preview or apply a human-confirmed PI/media reconciliation
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrivePiReconcileBody"
      responses:
        "200":
          description: Existing idempotent job returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobAccepted"
        "202":
          description: Reconciliation job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobAccepted"
        "400":
          description: Invalid or unsafe payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ops/jobs/campaign-publication-reconcile:
    post:
      operationId: createCampaignPublicationReconcileJob
      tags: [operations]
      summary: Recheck blocked drafts and resume campaigns with authoritative or unique operational identity
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                targetDate:
                  type: string
                  format: date
                insertionId:
                  type: integer
                  format: int32
                  minimum: 1
                  description: Restrict reconciliation to one existing canonical insertion.
      responses:
        "200":
          description: Existing idempotent reconciliation returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPublicationReconcileJobAccepted"
        "202":
          description: Reconciliation accepted by the Drive runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPublicationReconcileJobAccepted"
        "401":
          description: Operator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ops/jobs:
    get:
      operationId: listOpsJobs
      tags: [operations]
      summary: List operational jobs in compact form
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Operational jobs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /ops/jobs/{id}:
    get:
      operationId: getOpsJob
      tags: [operations]
      summary: Read the complete operational job for final inspection or diagnosis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete operational job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ops/jobs/{id}/progress:
    get:
      operationId: getOpsJobProgress
      tags: [operations]
      summary: Read compact operational job progress for polling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compact progress, stage and heartbeat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /campaign-operations/active:
    get:
      operationId: getActiveCampaignOperations
      tags: [operations]
      summary: Compare active sheet rows with exact Drive folders, AdOps and evidence
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: siteSigla
          in: query
          schema:
            type: string
        - name: includeEvidence
          in: query
          schema:
            type: boolean
            default: true
        - name: refreshDrive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Active and upcoming campaign diagnostics, including PI identity per source
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /campaign-operations/pending-publication:
    get:
      operationId: getPendingCampaignOperations
      tags: [operations]
      summary: Return only campaigns that still require publication or evidence
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Compact pending publication and evidence queue
          content:
            application/json:
              schema:
                type: object
                required: [date, generatedAt, summary, items]
                properties:
                  date: { type: string, format: date }
                  generatedAt: { type: string, format: date-time }
                  summary: { type: object, additionalProperties: true }
                  items:
                    type: array
                    items:
                      type: object
                      required: [commercialIdentityStatus, publicationStatus, resolutionStatus, operationalIdentity]
                      properties:
                        identityMode:
                          type: [string, "null"]
                          enum: [authoritative_pi, operational_identity, null]
                        commercialIdentityStatus:
                          type: string
                          enum: [confirmed, awaiting_authoritative_pi]
                        publicationStatus:
                          type: string
                          enum: [awaiting_authoritative_pi, ready_for_preflight, ready_for_publication, published, failed_retryable]
                        resolutionStatus: { type: string }
                        resolutionReason: { type: string }
                        resumeAction: { type: string }
                        lastCheckedAt: { type: string, format: date-time }
                        nextCheckAt: { type: [string, "null"], format: date-time }
                        operationalIdentity:
                          type: object
                          required: [gates, fingerprint, source]
                          properties:
                            gates:
                              type: object
                              additionalProperties: { type: boolean }
                            fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
                            source: { type: object, additionalProperties: true }
                      additionalProperties: true
                  upcomingItems: { type: array, items: {} }
                additionalProperties: true

  /campaign-operations/evidence-monthly-source:
    get:
      operationId: getMonthlyEvidenceSource
      tags: [operations]
      summary: Aggregate canonical insertions and audited daily evidence for the monthly report
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: competencia
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Monthly report source with compact daily evidence descriptors
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # Sites
  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List all sites
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteBody"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSite
      tags: [sites]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteBody"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Clients
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  # Agencies
  /agencies:
    get:
      operationId: listAgencies
      tags: [agencies]
      summary: List all agencies
      responses:
        "200":
          description: List of agencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agency"
    post:
      operationId: createAgency
      tags: [agencies]
      summary: Create an agency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgencyBody"
      responses:
        "201":
          description: Created agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"

  /agencies/{id}:
    patch:
      operationId: updateAgency
      tags: [agencies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgencyBody"
      responses:
        "200":
          description: Updated agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"

  # Campaigns
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      parameters:
        - name: competencia
          in: query
          schema:
            type: ["string", "null"]
        - name: clienteId
          in: query
          schema:
            type: ["integer", "null"]
        - name: agenciaId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign with insertions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignBody"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Insertions
  /insertions:
    get:
      operationId: listInsertions
      tags: [insertions]
      summary: List insertions with filters
      parameters:
        - name: competencia
          in: query
          schema:
            type: ["string", "null"]
        - name: siteId
          in: query
          schema:
            type: ["integer", "null"]
        - name: clienteId
          in: query
          schema:
            type: ["integer", "null"]
        - name: agenciaId
          in: query
          schema:
            type: ["integer", "null"]
        - name: campanhaId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: atrasado
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of insertions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsertionWithRelations"
    post:
      operationId: createInsertion
      tags: [insertions]
      summary: Create an insertion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInsertionBody"
      responses:
        "201":
          description: Created insertion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertionWithRelations"

  /insertions/{id}:
    get:
      operationId: getInsertion
      tags: [insertions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Insertion detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateInsertion
      tags: [insertions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInsertionBody"
      responses:
        "200":
          description: Updated insertion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertionWithRelations"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInsertion
      tags: [insertions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /insertions/{id}/media-consistency:
    get:
      operationId: getInsertionMediaConsistency
      tags: [operations, insertions]
      summary: Compare Drive media, AdOps media and the public AdRotate slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Media and PI consistency diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaConsistencyResult"
        "404":
          description: Insertion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /insertions/bulk-update:
    post:
      operationId: bulkUpdateInsertions
      tags: [insertions]
      summary: Bulk update multiple insertions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateInsertionsBody"
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"

  /insertions/{id}/capture-proof/status:
    get:
      operationId: getCaptureProofStatus
      tags: [insertions]
      summary: Consult capture proof and strict readiness status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Capture proof status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureProofStatus"
        "404":
          description: Insertion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /audit-checklists/validate-proof:
    post:
      operationId: validateCaptureProof
      tags: [insertions]
      summary: Validate capture proof, including strict readiness gates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCaptureProofBody"
      responses:
        "200":
          description: Approved capture proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditChecklistValidation"
        "422":
          description: Capture proof blocked by the checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditChecklistValidation"

  # Evidences
  /insertions/{insertionId}/evidences:
    get:
      operationId: listEvidences
      tags: [evidences]
      parameters:
        - name: insertionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of evidences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: createEvidence
      tags: [evidences]
      parameters:
        - name: insertionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceBody"
      responses:
        "201":
          description: Created evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"

  /insertions/{id}/evidences/export.zip:
    get:
      operationId: exportInsertionEvidences
      tags: [evidences]
      summary: Export insertion evidence package
      description: >-
        Exports the existing full operational package by default. Use
        mode=prints-only and variant=web to receive only optimized progressive JPEG copies;
        canonical evidence files and audit URLs are not changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mode
          in: query
          schema:
            type: string
            enum: [full, prints-only]
            default: full
        - name: variant
          in: query
          schema:
            type: string
            enum: [original, web]
            default: original
        - name: source
          in: query
          schema:
            type: [string, "null"]
      responses:
        "200":
          description: ZIP package
          headers:
            X-AdOps-Export-Images-Total:
              schema:
                type: integer
            X-AdOps-Export-Images-Generated:
              schema:
                type: integer
            X-AdOps-Export-Images-Failed:
              schema:
                type: integer
            X-AdOps-Export-Original-Bytes:
              schema:
                type: integer
            X-AdOps-Export-Output-Bytes:
              schema:
                type: integer
            X-AdOps-Export-Savings-Percent:
              schema:
                type: number
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid export options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Insertion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more source images could not be prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pi-site-exports/jobs:
    post:
      operationId: createPiSiteExportJob
      tags: [evidences]
      summary: Queue an asynchronous evidence package for one PI and site
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [piCodigo, siteSigla]
              properties:
                piCodigo:
                  type: string
                siteSigla:
                  type: string
                mode:
                  type: string
                  enum: [full-pdf, prints-only]
                  default: full-pdf
                variant:
                  type: string
                  enum: [original, web]
                  default: web
                imageMaxWidth:
                  type: integer
                  minimum: 800
                  maximum: 2560
                  default: 1600
                imageQuality:
                  type: integer
                  minimum: 45
                  maximum: 90
                  default: 72
      responses:
        "200":
          description: Existing idempotent PI/site export returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: PI/site export queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pi-site-exports/jobs/{jobId}:
    get:
      operationId: getPiSiteExportJob
      tags: [evidences]
      summary: Read asynchronous PI/site export status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PI/site export job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pi-site-exports/jobs/{jobId}/download:
    get:
      operationId: downloadPiSiteExportJob
      tags: [evidences]
      summary: Redirect to the completed PI/site export artifact
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the completed artifact
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Export is not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pi-site-exports:
    get:
      operationId: exportPiSitePackage
      tags: [evidences]
      summary: Describe or download evidence package by PI and site
      parameters:
        - name: piCodigo
          in: query
          required: true
          schema:
            type: string
        - name: siteSigla
          in: query
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: mode
          in: query
          schema:
            type: string
            enum: [full, prints-only]
            default: full
        - name: variant
          in: query
          schema:
            type: string
            enum: [original, web]
            default: original
      responses:
        "200":
          description: JSON descriptor when download is not 1, otherwise a ZIP package
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /campaign-evidence-exports/jobs:
    post:
      operationId: createCampaignEvidenceExportJob
      tags: [evidences]
      summary: Queue the complete audited JPEG package for a campaign across every portal
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [piCodigo, competencia]
              properties:
                piCodigo:
                  type: string
                competencia:
                  type: string
                mode:
                  type: string
                  const: prints-only
                  default: prints-only
                variant:
                  type: string
                  const: web
                  default: web
                imageMaxWidth:
                  type: integer
                  minimum: 800
                  maximum: 2560
                  default: 1600
                imageQuality:
                  type: integer
                  minimum: 45
                  maximum: 90
                  default: 72
      responses:
        "200":
          description: Existing idempotent campaign evidence export returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Campaign evidence export queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: Campaign identity is ambiguous or evidence coverage is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /campaign-evidence-exports/jobs/batch:
    post:
      operationId: createCampaignEvidenceExportBatch
      tags: [evidences]
      summary: Reuse cached campaign ZIPs and queue only campaigns whose approved evidence changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competencia, campaigns]
              properties:
                competencia:
                  type: string
                campaigns:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [piCodigo]
                    properties:
                      piCodigo:
                        type: string
                mode:
                  type: string
                  const: prints-only
                variant:
                  type: string
                  const: web
                imageMaxWidth:
                  type: integer
                  minimum: 800
                  maximum: 2560
                  default: 1600
                imageQuality:
                  type: integer
                  minimum: 45
                  maximum: 90
                  default: 72
      responses:
        "200":
          description: Every requested package was served from the immutable cache
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Cache misses were queued; each item reports its job and cache status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: One or more campaigns are blocked by incomplete evidence or ambiguous identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /campaign-evidence-exports/jobs/{jobId}:
    get:
      operationId: getCampaignEvidenceExportJob
      tags: [evidences]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign evidence export status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Job not found

  /campaign-evidence-exports/jobs/{jobId}/download:
    get:
      operationId: downloadCampaignEvidenceExport
      tags: [evidences]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the immutable campaign ZIP
        "409":
          description: Export is not completed
        "404":
          description: Campaign evidence export job not found

  /insertions/{id}/evidences/{date}/download:
    get:
      operationId: downloadInsertionEvidence
      tags: [evidences]
      summary: Download one approved canonical evidence as a progressive web JPEG
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [web]
            default: web
        - name: imageMaxWidth
          in: query
          required: false
          schema:
            type: integer
            enum: [1600]
            default: 1600
        - name: imageQuality
          in: query
          required: false
          schema:
            type: integer
            enum: [72]
            default: 72
      responses:
        "200":
          description: Progressive RGB JPEG attachment
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Insertion or evidence date not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Evidence exists but is not approved for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evidences/{id}:
    delete:
      operationId: deleteEvidence
      tags: [evidences]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Executive dashboard summary
      parameters:
        - name: competencia
