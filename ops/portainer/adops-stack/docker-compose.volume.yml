  adops-web:
    image: nginx:1.27-alpine
    container_name: adops-web
    restart: unless-stopped
    volumes:
      - adops_web_public:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${ADOPS_WEB_HOST_PORT:-4175}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - adops_public

volumes:
  adops_app_source:
    name: ${ADOPS_APP_SOURCE_VOLUME:-adops_app_source}
  adops_web_public:
    name: ${ADOPS_WEB_PUBLIC_VOLUME:-adops_web_public}
  adops_postgres_data:
    name: adops_postgres_data
  adops_generated_prints:
    name: adops_generated_prints
  adops_runner_state:
    name: adops_runner_state
  adops_pnpm_store:
    name: adops_pnpm_store
  adops_ssh:
    name: adops_ssh
  adops_drive_pi_monitor_data:
    external: true
    name: adops-drive-pi-monitor-data

networks:
  adops_internal:
    name: adops_internal
  adops_public:
    name: adops_public
