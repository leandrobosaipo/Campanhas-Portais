      - adops_app_source:/app
      - adops_pnpm_store:/var/lib/adops/.pnpm-store
      - adops_ssh:/root/.ssh:ro
      - adops_drive_pi_monitor_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4012/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
