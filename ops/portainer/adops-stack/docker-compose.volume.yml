      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      ADOPS_SPACES_BUCKET: ${ADOPS_SPACES_BUCKET:-cod5}
      ADOPS_VIDEO_MEDIA_BUCKET: ${ADOPS_VIDEO_MEDIA_BUCKET:-cod5}
      ADOPS_VIDEO_MEDIA_BASE_PATH: ${ADOPS_VIDEO_MEDIA_BASE_PATH:-adops-media}
      ADOPS_VIDEO_MEDIA_BUCKET_BY_SITE: ${ADOPS_VIDEO_MEDIA_BUCKET_BY_SITE:-}
