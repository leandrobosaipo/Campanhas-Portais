name: adops

services:
  adops-postgres:
    image: postgres:16-alpine
    container_name: adops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ADOPS_POSTGRES_DB:-adops}
      POSTGRES_USER: ${ADOPS_POSTGRES_USER:-adops}
      POSTGRES_PASSWORD: ${ADOPS_POSTGRES_PASSWORD:?ADOPS_POSTGRES_PASSWORD is required}
      TZ: America/Cuiaba
    volumes:
      - adops_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ADOPS_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - adops_internal

  adops-api:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    container_name: adops-api
    restart: unless-stopped
    working_dir: /app
    depends_on:
      adops-postgres:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        node artifacts/api-server/dist/index.mjs &
        cod5_api_pid=$$!
        (
          python3 - <<'PY' >/dev/null 2>&1 && command -v aws >/dev/null 2>&1 && command -v zip >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends python3-pip python3-pil zip && python3 -m pip install --break-system-packages --no-cache-dir awscli)
        from PIL import Image
        PY
          python3 -c 'import fastapi, uvicorn' >/dev/null 2>&1 || python3 -m pip install --break-system-packages --no-cache-dir -r /app/ops/fastapi-docs/requirements.txt
          exec python3 -m uvicorn main:app --app-dir /app/ops/fastapi-docs --host 127.0.0.1 --port 4013
        ) &
        cod5_docs_pid=$$!
        trap 'kill "$$cod5_api_pid" "$$cod5_docs_pid" 2>/dev/null || true' EXIT INT TERM
        wait "$$cod5_api_pid"
    environment:
      PORT: "4011"
      NODE_ENV: production
      TZ: America/Cuiaba
      DATABASE_URL: postgresql://${ADOPS_POSTGRES_USER:-adops}:${ADOPS_POSTGRES_PASSWORD:?ADOPS_POSTGRES_PASSWORD is required}@adops-postgres:5432/${ADOPS_POSTGRES_DB:-adops}
      ADOPS_PROJECT_ROOT: /app
      ADOPS_FASTAPI_DOCS_URL: http://127.0.0.1:4013
      ADOPS_PUBLIC_BASE_URL: https://adops-api.codigo5.com.br
      DRIVE_INTEGRATION_MODE: ${DRIVE_INTEGRATION_MODE:-monitor}
      ADOPS_DRIVE_INVENTORY_STALE_MS: ${ADOPS_DRIVE_INVENTORY_STALE_MS:-600000}
      ADOPS_TSX_BIN: /app/node_modules/.bin/tsx
      ADOPS_GENERATED_PRINTS_ROOT: /app/tmp/generated-prints
      ADOPS_CAPTURE_DISABLE_ORIGIN_OVERRIDE: ${ADOPS_CAPTURE_DISABLE_ORIGIN_OVERRIDE:-1}
      ADOPS_PRINT_TARGET_MAX_ATTEMPTS: ${ADOPS_PRINT_TARGET_MAX_ATTEMPTS:-3}
      ADOPS_PRINT_RETRY_BASE_MS: ${ADOPS_PRINT_RETRY_BASE_MS:-15000}
      ADOPS_PRINT_TARGET_COOLDOWN_MS: ${ADOPS_PRINT_TARGET_COOLDOWN_MS:-12000}
      ADOPS_INTERNAL_API_TOKEN: ${ADOPS_INTERNAL_API_TOKEN:?ADOPS_INTERNAL_API_TOKEN is required}
      OPS_API_TOKEN: ${OPS_API_TOKEN:?OPS_API_TOKEN is required}
      DO_SPACES_ACCESS_KEY_ID: ${DO_SPACES_ACCESS_KEY_ID:?DO_SPACES_ACCESS_KEY_ID is required}
      DO_SPACES_SECRET_ACCESS_KEY: ${DO_SPACES_SECRET_ACCESS_KEY:?DO_SPACES_SECRET_ACCESS_KEY is required}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      ADOPS_SPACES_BUCKET: ${ADOPS_SPACES_BUCKET:-cod5}
      ADOPS_SPACES_BASE_PATH: ${ADOPS_SPACES_BASE_PATH:-adops-prints}
      ADOPS_EXPORT_BUCKET: ${ADOPS_EXPORT_BUCKET:-cod5}
      ADOPS_EXPORT_BASE_PATH: ${ADOPS_EXPORT_BASE_PATH:-adops-exports}
      ADOPS_PERRENGUE_SSH_HOST: ${ADOPS_PERRENGUE_SSH_HOST:-}
      ADOPS_PERRENGUE_SSH_PORT: ${ADOPS_PERRENGUE_SSH_PORT:-}
      ADOPS_PERRENGUE_SSH_USER: ${ADOPS_PERRENGUE_SSH_USER:-}
      ADOPS_PERRENGUE_WP_PATH: ${ADOPS_PERRENGUE_WP_PATH:-}
      ADOPS_PERRENGUE_SSH_KEY_PATH: ${ADOPS_PERRENGUE_SSH_KEY_PATH:-/root/.ssh/id_rsa_perrengue_adops}
      ADOPS_MULTISITE_SSH_HOST: ${ADOPS_MULTISITE_SSH_HOST:-93.127.210.71}
      ADOPS_MULTISITE_SSH_PORT: ${ADOPS_MULTISITE_SSH_PORT:-22}
      ADOPS_MULTISITE_SSH_USER: ${ADOPS_MULTISITE_SSH_USER:-cod5adops}
      ADOPS_MULTISITE_SSH_KEY_PATH: ${ADOPS_MULTISITE_SSH_KEY_PATH:-/root/.ssh/id_rsa_facilnam_adops}
      ADOPS_CAPTURE_ALLOW_STATIC_RETRO_AD_INJECTION: "1"
    volumes:
      - adops_app_source:/app
      - adops_generated_prints:/app/tmp/generated-prints
      - adops_pnpm_store:/var/lib/adops/.pnpm-store
      - adops_ssh:/root/.ssh:ro
    ports:
      - "127.0.0.1:${ADOPS_API_HOST_PORT:-4011}:4011"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4011/api/healthz >/dev/null && curl -fsS http://127.0.0.1:4013/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 20
    networks:
      - adops_internal
      - adops_public

  adops-runner:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    container_name: adops-runner
    restart: unless-stopped
    working_dir: /app
    depends_on:
      adops-api:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >-
        set -e;
        if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
          apt-get update;
          apt-get install -y --no-install-recommends ffmpeg;
          rm -rf /var/lib/apt/lists/*;
        fi;
        command -v ffmpeg >/dev/null;
        command -v ffprobe >/dev/null;
        exec node ops/cloudflare-remote-runner/src/runner.mjs
    environment:
      TZ: America/Cuiaba
      DATABASE_URL: postgresql://${ADOPS_POSTGRES_USER:-adops}:${ADOPS_POSTGRES_PASSWORD:?ADOPS_POSTGRES_PASSWORD is required}@adops-postgres:5432/${ADOPS_POSTGRES_DB:-adops}
      OPS_API_BASE_URL: https://adops-api-public.leandro471.workers.dev
      OPS_API_TOKEN: ${OPS_API_TOKEN:?OPS_API_TOKEN is required}
      PRIVATE_ADOPS_API_BASE_URL: http://adops-api:4011
      PRIVATE_ADOPS_API_TOKEN: ${ADOPS_INTERNAL_API_TOKEN:?ADOPS_INTERNAL_API_TOKEN is required}
      CAMPANHAS_PORTAIS_ROOT: /app
      ADOPS_CAPTURE_DISABLE_ORIGIN_OVERRIDE: ${ADOPS_CAPTURE_DISABLE_ORIGIN_OVERRIDE:-1}
      PORTAINER_URL: ${PORTAINER_URL:-}
      ADOPS_REPORTS_PUBLISH_MOUNT: /sites-reports
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-3}
      ADOPS_PERRENGUE_ADROTATE_EXEC_MODE: ${ADOPS_PERRENGUE_ADROTATE_EXEC_MODE:-portainer}
      ADOPS_PERRENGUE_PORTAINER_ENDPOINT_ID: ${ADOPS_PERRENGUE_PORTAINER_ENDPOINT_ID:-3}
      ADOPS_PERRENGUE_WP_CONTAINER: ${ADOPS_PERRENGUE_WP_CONTAINER:-cod5-pro119-perrenguematogrosso-app}
      ADOPS_PERRENGUE_CONTAINER_WP_PATH: ${ADOPS_PERRENGUE_CONTAINER_WP_PATH:-/app/web/wp}
      ADOPS_PERRENGUE_CONTAINER_PHP_BIN: ${ADOPS_PERRENGUE_CONTAINER_PHP_BIN:-php}
      ADOPS_PERRENGUE_CONTAINER_WP_CLI_PATH: ${ADOPS_PERRENGUE_CONTAINER_WP_CLI_PATH:-wp}
      ADOPS_PERRENGUE_PORTAINER_TLS_INSECURE: ${ADOPS_PERRENGUE_PORTAINER_TLS_INSECURE:-true}
      ADOPS_PERRENGUE_REBUILD_TIMEOUT_MS: ${ADOPS_PERRENGUE_REBUILD_TIMEOUT_MS:-1200000}
      ADOPS_PERRENGUE_REBUILD_POLL_INTERVAL_MS: ${ADOPS_PERRENGUE_REBUILD_POLL_INTERVAL_MS:-5000}
      ADOPS_PERRENGUE_SSH_KEY_PATH: ${ADOPS_PERRENGUE_SSH_KEY_PATH:-/root/.ssh/id_rsa_perrengue_adops}
      ADOPS_MULTISITE_SSH_HOST: ${ADOPS_MULTISITE_SSH_HOST:-93.127.210.71}
      ADOPS_MULTISITE_SSH_PORT: ${ADOPS_MULTISITE_SSH_PORT:-22}
      ADOPS_MULTISITE_SSH_USER: ${ADOPS_MULTISITE_SSH_USER:-cod5adops}
      ADOPS_MULTISITE_SSH_KEY_PATH: ${ADOPS_MULTISITE_SSH_KEY_PATH:-/root/.ssh/id_rsa_facilnam_adops}
      OPS_POLL_INTERVAL_MS: ${OPS_POLL_INTERVAL_MS:-5000}
      ADOPS_IMAGE_TAG: ${ADOPS_IMAGE_TAG:-unknown}
      ADOPS_RUNNER_HEARTBEAT_INTERVAL_MS: ${ADOPS_RUNNER_HEARTBEAT_INTERVAL_MS:-60000}
      OPS_JOB_KINDS: sync-planilha,print-batch,print-backfill,analytics-report,evidence-monthly-report,operational-documents,reconcile-adrotate,adrotate-link,adrotate-publish,drive-pi-reconcile,telegram-send-evidence,runtime-readiness-probe
      DRIVE_PI_ARCHIVE_DIR: /var/lib/adops/drive-pi-archive
      COD5_VIDEO_COMPRESSOR_API_BASE: ${COD5_VIDEO_COMPRESSOR_API_BASE:-https://video-compress.codigo5.com.br}
      COD5_VIDEO_COMPRESSOR_API_TOKEN: ${COD5_VIDEO_COMPRESSOR_API_TOKEN:-}
      COD5_VIDEO_COMPRESSOR_PROFILE: ${COD5_VIDEO_COMPRESSOR_PROFILE:-balanced-720p}
      DO_SPACES_ACCESS_KEY_ID: ${DO_SPACES_ACCESS_KEY_ID:-}
      DO_SPACES_SECRET_ACCESS_KEY: ${DO_SPACES_SECRET_ACCESS_KEY:-}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      ADOPS_SPACES_BUCKET: ${ADOPS_SPACES_BUCKET:-cod5}
      ADOPS_EXPORT_BUCKET: ${ADOPS_EXPORT_BUCKET:-cod5}
      ADOPS_EXPORT_BASE_PATH: ${ADOPS_EXPORT_BASE_PATH:-adops-exports}
      ADOPS_VIDEO_MEDIA_BUCKET: ${ADOPS_VIDEO_MEDIA_BUCKET:-cod5}
      ADOPS_VIDEO_MEDIA_BASE_PATH: ${ADOPS_VIDEO_MEDIA_BASE_PATH:-adops-media}
      ADOPS_VIDEO_MEDIA_BUCKET_BY_SITE: ${ADOPS_VIDEO_MEDIA_BUCKET_BY_SITE:-}
      ADOPS_VIDEO_MEDIA_PUBLIC_BASE_URL: ${ADOPS_VIDEO_MEDIA_PUBLIC_BASE_URL:-}
      ADOPS_VIDEO_MEDIA_PUBLIC_BASE_BY_SITE: ${ADOPS_VIDEO_MEDIA_PUBLIC_BASE_BY_SITE:-}
      ADOPS_MEDIA_MAX_BYTES: ${ADOPS_MEDIA_MAX_BYTES:-268435456}
      ADOPS_DRIVE_PI_ALLOW_MUTATION: ${ADOPS_DRIVE_PI_ALLOW_MUTATION:-false}
      ADOPS_CAMPAIGN_AUTO_PUBLISH_ENABLED: ${ADOPS_CAMPAIGN_AUTO_PUBLISH_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADOPS_PI_AGENT_ENABLED: ${ADOPS_PI_AGENT_ENABLED:-true}
      ADOPS_PI_AGENT_AUTO_APPLY: ${ADOPS_PI_AGENT_AUTO_APPLY:-false}
      ADOPS_PI_AGENT_MODEL: ${ADOPS_PI_AGENT_MODEL:-gpt-4.1-mini}
      ADOPS_PI_AGENT_MIN_CONFIDENCE: ${ADOPS_PI_AGENT_MIN_CONFIDENCE:-0.85}
      ADOPS_PI_AGENT_KNOWLEDGE_FILE: ${ADOPS_PI_AGENT_KNOWLEDGE_FILE:-docs/adops/pi-automation-v3/spm-agent-knowledge.md}
      ADOPS_DRIVE_PI_ALLOWED_SITE_SIGLAS: ${ADOPS_DRIVE_PI_ALLOWED_SITE_SIGLAS:-}
      ADOPS_TELEGRAM_BOT_URL: ${ADOPS_TELEGRAM_BOT_URL:-https://adops-telegram-bot.leandro471.workers.dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_GROUP_ID: ${TELEGRAM_DEFAULT_GROUP_ID:-}
    volumes:
      - adops_app_source:/app
      - adops_runner_state:/var/lib/adops
      - adops_pnpm_store:/var/lib/adops/.pnpm-store
      - adops_ssh:/root/.ssh:ro
      - /home/codigo5/projetos/balboa/reports:/sites-reports
    networks:
      - adops_internal

  adops-drive-pi-monitor:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    container_name: adops-drive-pi-monitor-stack
    restart: unless-stopped
    working_dir: /app
    depends_on:
      adops-api:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >-
        set -e;
        if ! python3 -c 'from PIL import Image' >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
          apt-get update;
          apt-get install -y --no-install-recommends python3-pil poppler-utils ffmpeg;
          rm -rf /var/lib/apt/lists/*;
        fi;
        python3 -c 'from PIL import Image';
        command -v pdftotext >/dev/null;
        command -v ffmpeg >/dev/null;
        command -v ffprobe >/dev/null;
        exec node ops/cloudflare-remote-runner/src/runner.mjs
    environment:
