name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adops_source_conflict_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adops_source_conflict_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API clients
        run: pnpm --filter @workspace/api-spec run codegen
      - name: Reject generated contract drift
        run: git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --dir scripts run test:api-bundle-runtime
      - name: Install image export runtime
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y python3-pil imagemagick ffmpeg php-cli zip unzip
      - run: pnpm --dir scripts run test:evidence-web-export
      - run: pnpm --dir scripts run test:monthly-report-export-eligibility
      - name: Recovery provenance and immutable exports
        run: |
          node scripts/src/test-historical-reconstruction-frame.mjs
          node scripts/src/test-drive-pi-recovery-target.mjs
          node --test ops/cloudflare-remote-runner/test/pi-layout-identity.test.mjs
          pnpm --dir scripts exec tsx src/test-campaign-evidence-fingerprint.ts
          pnpm --dir scripts exec tsx src/test-preupload-reconstruction-clock.ts
          pnpm --dir scripts exec node --import tsx --test src/test-capture-proof-candidates.ts src/test-candidate-promotion-capture-guard.ts
          pnpm --dir scripts exec tsx src/test-export-audit-capture-class.mjs
          node --test scripts/src/test-historical-presentation-upgrade-guard.mjs scripts/src/test-historical-evidence-inventory.mjs
      - name: Install capture browser
        run: pnpm --dir scripts exec playwright install --with-deps chromium
      - name: Reconstructed frame and observed portal favicon
        run: |
          node scripts/src/test-windows-frame-v5.mjs
          node scripts/src/test-observed-tab-favicon.mjs
          node scripts/src/test-native-video-progress-audit.mjs
          node scripts/src/test-monthly-report-incremental-refresh.mjs
          node scripts/src/test-deploy-post-switch-readback.mjs
          node scripts/src/test-adrotate-preview-clock.mjs
      - name: PNMT reconstructed desktop anchor guards
        run: |
          node scripts/src/test-cross-portal-retro-reconstruction.mjs
          node scripts/src/test-pnmt-static-retro-anchor.mjs
      - run: pnpm --dir scripts run test:strict-capture-readiness
      - run: pnpm --dir scripts run test:retro-content-time
      - run: pnpm --dir scripts run test:pixel-date-proof
      - run: pnpm --dir scripts run test:adops-definitive-gates
      - run: pnpm --dir scripts run test:afl-retro-date-config-isolation
      - run: node --check scripts/src/capture-insertion-proof.cjs
      - run: node scripts/src/test-perrengue-header-dom-policy.mjs
      - run: node scripts/src/test-perrengue-header-ad-policy.mjs
      - run: node --check ops/cloudflare-remote-runner/src/runner.mjs
      - run: pnpm --dir scripts run test:perrengue-static-retro-sparse
      - run: pnpm --filter @workspace/adops run build
      - run: pnpm --dir scripts run test:runtime-auth
      - run: pnpm --dir scripts run test:drive-pi-event-flow
      - run: pnpm --dir scripts run test:drive-pi-publish-flow
      - run: node scripts/src/test-recovery-safety-sep17.mjs
      - run: node scripts/src/test-home1-media-profiles.mjs
      - run: node --test scripts/src/test-daily-print-completeness.mjs scripts/src/test-daily-print-status.mjs scripts/src/test-async-daily-print-batch-contract.mjs
      - run: node scripts/src/test-afl-retro-bounded-normalization.mjs
      - run: node scripts/src/test-relative-editorial-date-scope.mjs
      - run: node scripts/src/test-adrotate-normal-observation.mjs
      - run: pnpm --dir scripts exec tsx src/test-adrotate-live-observation.ts
      - run: node --test scripts/src/test-dynamic-report-counters-vm.mjs
      - run: node scripts/src/test-operational-publication-preflight.mjs
      - run: pnpm --dir scripts exec tsx src/test-monthly-report-query.ts
      - name: Reconstruction technical acceptance contract
        run: |
          node --test scripts/src/test-dynamic-evidence-report.mjs scripts/src/test-monthly-evidence-contract.mjs scripts/src/test-report-period-export.mjs scripts/src/test-report-period-download-vm.mjs scripts/src/test-report-load-deadline-vm.mjs
          node --test --test-name-pattern='organiza a agenda' scripts/src/test-monthly-report-mobile-ui.mjs
          pnpm --dir scripts exec tsx --test src/test-capture-audit-immutability.ts src/test-native-video-progress-audit.ts
      - name: Candidate report review and reference timezone
        run: |
          TZ=UTC node scripts/src/test-retroactive-report-candidate-ui.mjs
          TZ=America/New_York node scripts/src/test-retroactive-report-candidate-ui.mjs
      - run: pnpm --dir scripts exec tsx src/test-evidence-date-serialization.ts
      - run: pnpm --dir scripts run test:drive-source-conflicts
      - name: Candidate promotion transaction and rollback
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/candidate_audit_test
          ADOPS_PROMOTION_TEST: "1"
          ADOPS_CANDIDATE_REGISTRY_TEST: "1"
          ADOPS_HISTORICAL_INVENTORY_TEST: "1"
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE candidate_audit_test"
          pnpm --filter @workspace/db run push-force
          # The isolated fixture must include the SQL-only checks, FKs and immutable triggers.
          # These newly created tables are empty; CREATE IF NOT EXISTS would retain the ORM-only schema.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE capture_proof_candidate_promotions, capture_proof_candidate_reviews, capture_proof_candidates"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/portainer/adops-stack/migrations/2026-10-02-capture-proof-candidates.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/portainer/adops-stack/migrations/2026-10-02-candidate-promotions.sql
          pnpm --dir scripts exec node --import tsx --test src/test-capture-candidate-promotion.integration.ts
          pnpm --dir scripts exec node --import tsx --test src/test-capture-proof-candidate-registry.integration.ts
          pnpm --dir scripts exec node --import tsx --test src/test-historical-evidence-inventory.integration.ts
      - run: pnpm --dir scripts run test:adrotate-format-aliases
      - run: pnpm --dir scripts run test:media-consistency
      - run: pnpm --dir scripts run test:drive-inventory-flow
      - run: pnpm --dir scripts run test:git-platform-pilot
      - run: pnpm --dir scripts run harness:drive-pi-monitor-first-v4
      - run: pnpm --dir scripts run audit:capture-rules-integrity
      - name: Validate production compose
        env:
          ADOPS_IMAGE_TAG: ci
          ADOPS_RELEASE_SHA: ci
          ADOPS_POSTGRES_PASSWORD: ci-only
          ADOPS_INTERNAL_API_TOKEN: ci-only
          ADOPS_GOOGLE_ALLOWED_EMAILS: ci@example.invalid
          ADOPS_SESSION_SECRET: ci-only
          DO_SPACES_ACCESS_KEY_ID: ci-only
          DO_SPACES_SECRET_ACCESS_KEY: ci-only
          GOOGLE_CLIENT_ID: ci-only
          GOOGLE_CLIENT_SECRET: ci-only
          OPS_API_TOKEN: ci-only
        run: |
          docker compose -f ops/portainer/adops-stack/docker-compose.yml config >/dev/null
          docker compose -f ops/portainer/adops-stack/docker-compose.volume.yml config >/dev/null

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan release tree for secrets
        run: docker run --rm -w /repo -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 dir . --gitleaks-ignore-path . --redact --no-banner
