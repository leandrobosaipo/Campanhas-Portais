name: Deploy production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit SHA to deploy
        required: false
      drive_mode:
        description: Google Drive integration mode
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - legacy

permissions:
  contents: read

concurrency:
  group: adops-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install release dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy release SHA through Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          ADOPS_IMAGE_TAG: ${{ inputs.git_sha || github.sha }}
          ADOPS_RELEASE_SHA: ${{ inputs.git_sha || github.sha }}
          DRIVE_INTEGRATION_MODE: ${{ inputs.drive_mode || 'monitor' }}
        run: bash ops/portainer/adops-stack/scripts/deploy-production.sh
