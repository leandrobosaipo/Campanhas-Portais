stages:
  - validate
  - security
  - preflight

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

validate:
  stage: validate
  timeout: 30m
  script:
    - pnpm --filter @workspace/api-spec run codegen
    - git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
    - pnpm run typecheck
    - pnpm --filter @workspace/api-server run build
    - pnpm --filter @workspace/adops run build
    - pnpm --dir scripts run test:runtime-auth
    - pnpm --dir scripts run test:drive-pi-event-flow
    - pnpm --dir scripts run test:drive-pi-publish-flow
    - pnpm --dir scripts run test:drive-inventory-flow
    - pnpm --dir scripts run test:git-platform-pilot
    - pnpm --dir scripts run harness:drive-pi-monitor-first-v4
    - pnpm --dir scripts run audit:capture-rules-integrity

compose:
  stage: validate
  image: docker:27-cli
  before_script: []
  variables:
    ADOPS_IMAGE_TAG: ci
    ADOPS_POSTGRES_PASSWORD: ci-only
    ADOPS_INTERNAL_API_TOKEN: ci-only
    DO_SPACES_ACCESS_KEY_ID: ci-only
    DO_SPACES_SECRET_ACCESS_KEY: ci-only
    OPS_API_TOKEN: ci-only
  script:
    - docker compose -f ops/portainer/adops-stack/docker-compose.yml config >/dev/null
    - docker compose -f ops/portainer/adops-stack/docker-compose.volume.yml config >/dev/null

secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks dir . --redact --no-banner

preflight_production:
  stage: preflight
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash ops/portainer/adops-stack/scripts/preflight-production.sh
  environment:
    name: production
  resource_group: adops-production
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
